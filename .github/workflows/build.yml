name: Build

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pull requests run a reduced matrix: every toolchain in Debug, plus one Release job per OS for the
# Release-only code paths. MinGW, Clang Release, Linux arm64 and macOS Release only run on pushes to main
# and manual runs (workflow_dispatch), which always use the full matrix.

env:
  # LLVM major version for clang-cl, Linux Clang and the sanitizer build (same as linter.yml and local development)
  LLVM_VERSION: 20
  # vcpkg binary cache: built dependencies are stored here and persisted between runs with actions/cache
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite

jobs:
  # ---------------------- Windows: MSVC + GCC + Clang ----------------------
  windows:
    name: Windows (${{ matrix.toolchain }} | ${{ matrix.config }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        toolchain: [ msvc, gcc, clang ]
        config:    [ Debug, Release ]
        exclude: ${{ fromJSON(github.event_name == 'pull_request' && '[{"toolchain":"gcc"},{"toolchain":"clang","config":"Release"}]' || '[]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ matrix.toolchain }}-${{ hashFiles('vcpkg.json', 'scripts/setup.sh') }}
          restore-keys: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ matrix.toolchain }}-

      - name: Create vcpkg binary cache directory
        shell: bash
        run: mkdir -p .vcpkg-cache

      # clang-cl with Ninja needs the MSVC developer environment (headers, libs, linker)
      - name: Set up MSVC environment
        if: matrix.toolchain != 'gcc'
        uses: ilammy/msvc-dev-cmd@v1

      # The runner image ships whatever LLVM is current; pin it so clang-cl matches the other Clang builds
      - name: Install LLVM ${{ env.LLVM_VERSION }} (clang-cl)
        if: matrix.toolchain == 'clang'
        shell: bash
        run: |
          choco upgrade llvm --version=20.1.8 --allow-downgrade -y --no-progress
          version=$(clang-cl --version | sed -nE 's/.*version ([0-9]+)\..*/\1/p' | head -1)
          if [[ "$version" != "$LLVM_VERSION" ]]; then
            echo "::error::Expected clang-cl $LLVM_VERSION but found $version ($(command -v clang-cl))"
            exit 1
          fi

      - name: Remove preinstalled MSYS2 (if present)
        if: matrix.toolchain == 'gcc'
        shell: bash
        run: rm -rf /c/msys64 || true

      - name: Set up MSYS2 (mingw64)
        if: matrix.toolchain == 'gcc'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: MINGW64
          location: C:\
          install: >-
            base-devel
            git
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-gcc

      - name: Setup, build & test (MSVC / clang-cl)
        if: matrix.toolchain != 'gcc'
        shell: bash
        run: |
          ./scripts/setup.sh
          ./scripts/build.sh -t ${{ matrix.toolchain }} -c ${{ matrix.config }} --test

      - name: Setup, build & test (MinGW GCC)
        if: matrix.toolchain == 'gcc'
        shell: msys2 {0}
        run: |
          ./scripts/setup.sh
          ./scripts/build.sh -t ${{ matrix.toolchain }} -c ${{ matrix.config }} --test

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.toolchain }}-${{ matrix.config }}-windows
          path: build/*/app/${{ matrix.config }}/
          if-no-files-found: error

  # ---------------------- Linux: GCC + Clang (x64 + arm64), sanitizers ----------------------
  linux:
    name: Linux ${{ matrix.os == 'ubuntu-24.04-arm' && 'arm64' || 'x64' }} (${{ matrix.toolchain }} | ${{ matrix.config }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:        [ ubuntu-24.04, ubuntu-24.04-arm ]
        toolchain: [ gcc, clang ]
        config:    [ Debug, Release ]
        exclude: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"ubuntu-24.04-arm"},{"toolchain":"clang","config":"Release"}]' || '[]') }}
        include:
          # Clang with AddressSanitizer + UndefinedBehaviorSanitizer (single-config Debug)
          - os: ubuntu-24.04
            toolchain: asan
            config: Debug
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ matrix.toolchain }}-${{ hashFiles('vcpkg.json', 'scripts/setup.sh') }}
          restore-keys: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ matrix.toolchain }}-

      - name: Create vcpkg binary cache directory
        run: mkdir -p .vcpkg-cache

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build cmake

      - name: Install LLVM ${{ env.LLVM_VERSION }}
        if: matrix.toolchain != 'gcc'
        run: .github/scripts/install-llvm.sh "$LLVM_VERSION"

      - name: Setup (vcpkg etc)
        run: ./scripts/setup.sh

      - name: Build & test
        run: ./scripts/build.sh -t ${{ matrix.toolchain }} -c ${{ matrix.config }} --test

      - name: Upload app artifact
        if: matrix.toolchain != 'asan'
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.toolchain }}-${{ matrix.config }}-linux-${{ runner.arch }}
          path: build/*/app/${{ matrix.config }}/
          if-no-files-found: error

  # ---------------------- macOS: AppleClang ----------------------
  macos:
    name: macOS (${{ matrix.toolchain }} | ${{ matrix.config }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        toolchain: [ appleclang ]
        config:    [ Debug, Release ]
        exclude: ${{ fromJSON(github.event_name == 'pull_request' && '[{"config":"Release"}]' || '[]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ matrix.toolchain }}-${{ hashFiles('vcpkg.json', 'scripts/setup.sh') }}
          restore-keys: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ matrix.toolchain }}-

      - name: Create vcpkg binary cache directory
        run: mkdir -p .vcpkg-cache

      - name: Install deps
        run: |
          brew update
          brew install ninja cmake

      - name: Setup (vcpkg etc)
        run: ./scripts/setup.sh

      - name: Build & test
        run: ./scripts/build.sh -t ${{ matrix.toolchain }} -c ${{ matrix.config }} --test

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.toolchain }}-${{ matrix.config }}-macos
          path: build/mac-appleclang/app/${{ matrix.config }}/
          if-no-files-found: error
